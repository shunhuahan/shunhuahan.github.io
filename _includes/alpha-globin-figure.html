<figure class="fig-panel ag" aria-labelledby="ag-title">
  <header class="fig-head">
    <p class="fig-label">Figure 4</p>
    <h3 class="fig-title" id="ag-title">The configuration matters, not just the count</h3>
    <p class="fig-sub">Common alpha-globin genotypes. Each pair of bars is the two copies of chromosome 16, each normally carrying two alpha-globin genes; hollow genes are deleted.</p>
  </header>
  <div class="ag-board">
    <p class="ag-bracket"><span>Same count, different risk</span></p>
    <ol class="ag-cols" aria-label="Alpha-globin genotypes from four genes to none">
      <li class="ag-col">
        <span class="ag-glyph" aria-hidden="true"><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene"></i></span><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene"></i></span></span>
        <b class="ag-n">4</b>
        <span class="ag-gt">αα/αα</span>
        <span class="ag-status">Unaffected</span>
      </li>
      <li class="ag-col">
        <span class="ag-glyph" aria-hidden="true"><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene is-lost"></i></span><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene"></i></span></span>
        <b class="ag-n">3</b>
        <span class="ag-gt">&minus;α/αα</span>
        <span class="ag-status">Silent carrier</span>
      </li>
      <li class="ag-col ag-cis">
        <span class="ag-glyph" aria-hidden="true"><span class="ag-chr"><i class="ag-gene is-lost"></i><i class="ag-gene is-lost"></i></span><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene"></i></span></span>
        <b class="ag-n">2</b>
        <span class="ag-gt">&minus;&minus;/αα</span>
        <span class="ag-status">Trait</span><span class="ag-note">Both deleted on one chromosome, e.g. <span class="ag-allele">&minus;&minus;<sup>SEA</sup></span></span>
      </li>
      <li class="ag-col ag-trans">
        <span class="ag-glyph" aria-hidden="true"><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene is-lost"></i></span><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene is-lost"></i></span></span>
        <b class="ag-n">2</b>
        <span class="ag-gt">&minus;α/&minus;α</span>
        <span class="ag-status">Trait</span><span class="ag-note">One deleted on each, e.g. <span class="ag-allele">&minus;α<sup>3.7</sup></span></span>
      </li>
      <li class="ag-col">
        <span class="ag-glyph" aria-hidden="true"><span class="ag-chr"><i class="ag-gene is-lost"></i><i class="ag-gene is-lost"></i></span><span class="ag-chr"><i class="ag-gene"></i><i class="ag-gene is-lost"></i></span></span>
        <b class="ag-n">1</b>
        <span class="ag-gt">&minus;&minus;/&minus;α</span>
        <span class="ag-status">HbH disease</span>
      </li>
      <li class="ag-col">
        <span class="ag-glyph" aria-hidden="true"><span class="ag-chr"><i class="ag-gene is-lost"></i><i class="ag-gene is-lost"></i></span><span class="ag-chr"><i class="ag-gene is-lost"></i><i class="ag-gene is-lost"></i></span></span>
        <b class="ag-n">0</b>
        <span class="ag-gt">&minus;&minus;/&minus;&minus;</span>
        <span class="ag-status">Hb Bart's hydrops fetalis</span>
      </li>
    </ol>
  </div>
  <figcaption>The two middle genotypes carry the same two genes, so a gene count cannot separate them, and reads inside <i>HBA1</i> and <i>HBA2</i> are ambiguous in any case. The difference matters for carrier screening: only the <i>cis</i> configuration passes on a chromosome with no alpha-globin genes. Deletions of different extent leave different depth signatures in the non-homologous sequence around the genes, and that is what the caller reads.</figcaption>
</figure>
