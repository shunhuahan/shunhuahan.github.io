<style>
/* ── Hero ── */
.hero {
  position: relative;
  /* Own stacking context so the z-index:-1 glows stay inside the hero
     instead of being painted behind the body background. */
  isolation: isolate;
  padding: 12px 4px 8px;
}
.hero::before {
  content: '';
  position: absolute;
  top: -140px;
  left: -180px;
  width: 560px;
  height: 560px;
  background: radial-gradient(circle, rgba(47, 95, 224, 0.09), transparent 62%);
  pointer-events: none;
  z-index: -1;
}
.hero::after {
  content: '';
  position: absolute;
  top: -60px;
  right: -140px;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(13, 148, 136, 0.07), transparent 62%);
  pointer-events: none;
  z-index: -1;
}
.hero-top {
  display: flex;
  align-items: center;
  gap: 26px;
  margin-bottom: 28px;
}
.hero-photo {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  flex-shrink: 0;
  border: 3px solid #ffffff;
  box-shadow: 0 2px 14px rgba(20, 23, 31, 0.16);
}
.hero-rule {
  width: 52px;
  height: 4px;
  border-radius: 2px;
  border: none;
  margin: 0 0 12px;
  background: linear-gradient(90deg, #2f5fe0, #0d9488);
}
.hero-eyebrow {
  margin: 0 0 10px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #2f5fe0;
}
.hero-name {
  margin: 0;
  font-family: 'Google Sans Flex', 'Inter', -apple-system, sans-serif;
  font-size: clamp(2.6rem, 7vw, 4.3rem);
  font-weight: 720;
  letter-spacing: -0.025em;
  line-height: 1.02;
  color: #14171f;
  border: none;
}
.hero-tagline {
  max-width: 660px;
  font-size: 17.5px;
  line-height: 1.7;
  color: #3d4451;
  margin: 0 0 28px;
}
.hero-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

@media (max-width: 600px) {
  .hero-top { gap: 18px; }
  .hero-photo { width: 68px; height: 68px; }
}

html.dark .hero::before { background: radial-gradient(circle, rgba(91, 141, 255, 0.10), transparent 62%); }
html.dark .hero::after { background: radial-gradient(circle, rgba(45, 212, 191, 0.07), transparent 62%); }
html.dark .hero-photo { border-color: #171b28; box-shadow: 0 2px 12px rgba(0,0,0,0.35); }
html.dark .hero-eyebrow { color: #5b8dff; }
html.dark .hero-name { color: #e7e9ee; }
html.dark .hero-tagline { color: #b7bfcc; }

/* ── Recent News / Contact (hairline sections, no boxing) ── */
.home-news-card {
  margin-top: 48px;
  padding-top: 26px;
  border-top: 1px solid #e4e7ee;
}
.home-section-title {
  margin: 0 0 20px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #2f5fe0;
  border: none;
}
.news-item {
  display: flex;
  gap: 16px;
  padding: 13px 0;
  border-bottom: 1px solid #eef0f4;
  align-items: flex-start;
}
.news-item:last-of-type { border-bottom: none; }
.news-year {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: #2f5fe0;
  padding-top: 3px;
  min-width: 36px;
}
.news-item-body { flex: 1; min-width: 0; }
.news-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  vertical-align: middle;
}
.badge-pub    { background: #e0f2fe; color: #0369a1; }
.badge-talk   { background: #f0fdf4; color: #15803d; }
.badge-poster { background: #fef9c3; color: #854d0e; }
.news-title { font-size: 13.5px; font-weight: 500; color: #14171f; line-height: 1.5; margin: 0 0 2px; }
.news-title a { color: #14171f; text-decoration: none; }
.news-title a:hover { color: #2f5fe0; }
.news-venue { font-size: 12px; color: #8790a0; margin: 0; font-style: italic; }
.contact-text { font-size: 15px; color: #3d4451; margin: 0; }
.contact-email {
  font-family: 'Google Sans Code', 'Courier New', monospace;
  font-size: 14px;
  color: #14171f;
  background: #eef0f4;
  padding: 1px 6px;
  border-radius: 4px;
}

html.dark .home-news-card { border-top-color: #262b3a; }
html.dark .home-section-title { color: #5b8dff; }
html.dark .news-item { border-bottom-color: #262b3a; }
html.dark .news-title, html.dark .news-title a { color: #e7e9ee; }
html.dark .news-title a:hover { color: #5b8dff; }
html.dark .news-venue { color: #8790a0; }
html.dark .badge-pub    { background: #0c2d48; color: #7dd3fc; }
html.dark .badge-talk   { background: #052e16; color: #86efac; }
html.dark .badge-poster { background: #2d1a00; color: #fcd34d; }
html.dark .contact-text { color: #b7bfcc; }
html.dark .contact-email { background: #171b28; color: #e7e9ee; }

@media (max-width: 640px) { .home-news-card { padding-top: 22px; } }
</style>
