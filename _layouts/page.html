---
layout: default
---

<article class="page{% if page.wide %} is-wide{% endif %}">
  {% if page.headline %}
  <header class="page-head">
    <p class="page-eyebrow">{{ page.title }}</p>
    <h1>{{ page.headline }}</h1>
  </header>
  {% else %}
  <header class="page-head">
    <h1>{{ page.title }}</h1>
  </header>
  {% endif %}
  <div class="entry">
    {{ content }}
  </div>
</article>
